<!--creating a sample html file call index.html-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API test</title>
</head>
<body>
    <p>api test</p>
    <!---create the paragraph tab of id title,body,userId-->
    <p id="userId"></p>
    <p id ='title'></p>
    <p id ='body'></p>
    <script>
        <!-- fectching the api data using the fetch method api-->
        fetch("https://jsonplaceholder.typicode.com/posts")
        .then(response=>{
            return response.json()
        })
        .then(data=>{
            <!--get the api data-->
            
            <!--lets access the id using the querySelector-->
            document.querySelector('#userId').textContent = data[0].userId;
            document.querySelector('#title').textContent = data[0].title;
            document.querySelector('#body').textContent = data[0].body;
            <!--the query selector gives the acces to our paragraph tab-->
            <!--and through the textContent it giving access manupulate the paragraph tag content-->
            <!-- lets check what we done-->
            <!--its successfully working -->
        })
    </script>
</body>
</html>
